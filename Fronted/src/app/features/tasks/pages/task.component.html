<!-- Tarjeta contenedora -->
<mat-card class="tasks-card">

  <!-- Título y filtro -->
  <div class="tasks-header">
    <h2>Lista de Tareas</h2>

    <!-- (Opcional) contador rápido -->
    <span matBadge="{{ tareas.length }}" matBadgeColor="accent"
          matBadgeSize="small" aria-label="Cantidad de tareas">
    </span>
  </div>

  

  <!-- -------- Alta de tarea -------- -->
  <form class="add-form" (ngSubmit)="agregarTarea()" #f="ngForm">

    <mat-form-field appearance="outline" class="flex-1">
      <mat-label>Título</mat-label>
      <input matInput name="titulo" [(ngModel)]="nuevoTitulo" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="flex-2">
      <mat-label>Descripción</mat-label>
      <input matInput name="descripcion" [(ngModel)]="nuevaDescripcion" />
    </mat-form-field>

    <mat-checkbox [(ngModel)]="nuevaCompletada"
                  name="completada" class="add-check">
      Completada
    </mat-checkbox>

    <button mat-raised-button color="primary"
            [disabled]="f.invalid">Agregar</button>
  </form>

  <mat-divider></mat-divider>

  <!-- -------- Lista -------- -->
  <mat-list dense>

    <mat-list-item *ngFor="let tarea of tareas" [ngClass]="{ done: tarea.completada }">
      <!-- CHECKBOX A LA IZQUIERDA -->
      <mat-checkbox
        [checked]="tarea.completada"
        (change)="toggleCompletada(tarea)">
      </mat-checkbox>
    
      <!-- CONTENEDOR FLEXIBLE -->
      <div class="item-content">
        <div class="tarea-info">
          <span class="tarea-titulo">{{ tarea.titulo }}</span>
          <small *ngIf="tarea.descripcion" class="tarea-desc">– {{ tarea.descripcion }}</small>
        </div>
    
        <div class="actions">
          <span class="estado">
            {{ tarea.completada ? '✅ Completada' : '👨‍💻 Pendiente' }}
          </span>
    
          <button mat-icon-button (click)="startEdit(tarea)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
    
          <button mat-icon-button color="warn" (click)="eliminarTarea(tarea.id)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </mat-list-item>

  </mat-list>
</mat-card>
