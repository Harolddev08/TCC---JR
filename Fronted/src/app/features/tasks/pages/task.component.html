<h2>Lista de Tareas</h2>

<!-- -------- formulario alta -------- -->
<form class="add-form" (ngSubmit)="agregarTarea()">
  <input  type="text"       placeholder="Título"
          [(ngModel)]="nuevoTitulo"      name="titulo" required />

  <input  type="text"       placeholder="Descripción"
          [(ngModel)]="nuevaDescripcion" name="descripcion" />

  <label>
    <input type="checkbox" [(ngModel)]="nuevaCompletada" name="completada" />
    Completada
  </label>

  <button type="submit">Agregar</button>
</form>

<!-- -------- lista -------- -->
<ul>
  <li *ngFor="let tarea of tareas">

    <!-- checkbox estado -->
    <input type="checkbox"
           [checked]="tarea.completada"
           (change)="toggleCompletada(tarea)" />

    <!-- --------- vista normal --------- -->
    <ng-container *ngIf="editingTaskId !== tarea.id; else editTpl">
      {{ tarea.titulo }} –
      {{ tarea.completada ? '✅ Completada' : '👨‍💻 Pendiente' }}

      <button (click)="startEdit(tarea)" title="Editar">✏️</button>
      <button (click)="eliminarTarea(tarea.id)" title="Eliminar">🗑️</button>
    </ng-container>

    <!-- --------- modo edición --------- -->
    <ng-template #editTpl>
      <input [(ngModel)]="editTitulo"      placeholder="Título" />
      <input [(ngModel)]="editDescripcion" placeholder="Descripción" />

      <button (click)="saveEdit(tarea)"   title="Guardar">💾</button>
      <button (click)="cancelEdit()"      title="Cancelar">❌</button>
    </ng-template>

  </li>
</ul>
